name = "explicit-unirational"
version = "0.1.0"
defaultTargets = ["ExplicitUnirational"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[[lean_lib]]
name = "ExplicitUnirational"

[[lean_lib]]
name = "Statement"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
