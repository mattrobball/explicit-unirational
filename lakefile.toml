name = "explicit-unirational"
version = "0.1.0"
defaultTargets = ["ExplicitUnirational"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

# Reflective polynomial-identity checking (`algebra_norm_reflect`, kernel certificate path).
# Pinned to the `poly-repr-reflect` branch; bump the rev deliberately.
[[require]]
name = "Macaulean"
git = "https://github.com/Macaulean/Macaulean.git"
rev = "f5d48712fe6afba7eefff37d33a079d7a87bfad0"

[[lean_lib]]
name = "ExplicitUnirational"

[[lean_lib]]
name = "Statement"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
