name = "explicit-unirational"
version = "0.1.0"
defaultTargets = ["ExplicitUnirational"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

# Reflective polynomial-identity checking (`algebra_norm_reflect`, GMP-free certificate path).
# Pinned to the `gmp-free-certificates` branch; bump the rev deliberately.
[[require]]
name = "Macaulean"
git = "https://github.com/Macaulean/Macaulean.git"
rev = "9416dffa7554d147a39d0de9278d051d95032b57"

[[lean_lib]]
name = "ExplicitUnirational"

[[lean_lib]]
name = "Statement"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
